Это срочно|éta sróschna|Es ist dringend||5`.split("\n").map(r=>{const a=r.split("|");return{u:a[0],tr:a[1],mean:a[2],tip:a[3],g:+a[4]}});
const GG=["","Satzbau","Nomen","Verben","Fälle"];
const Gd=`1|„Ich bin Student“ – wie sagt man das?|Я студент|Я есть студент|Я быть студент|Im Präsens fehlt „sein“ einfach. Man sagt wörtlich: „Ich Student“.
1|Wie wird aus „Ты студент.“ eine Frage?|Nur mit steigender Stimme: Ты студент?|Mit Hilfsverb: Ты есть студент?|Mit umgedrehter Wortstellung|Fragen entstehen allein durch die Betonung. Im Text steht nur ein Fragezeichen.
1|Wie sagt man „Ich weiß nicht“?|Я не знаю|Я нет знаю|Нет я знаю|не steht direkt vor dem Verb. нет ist das eigenständige „Nein“.
1|Wie viele Artikel (der, die, das) hat Russisch?|Keine|Drei, wie im Deutschen|Einen: тот|книга heißt „Buch“, „das Buch“ und „ein Buch“. Artikel gibt es nicht.
2|Welches Geschlecht hat „книга“ (Buch)?|weiblich|männlich|sächlich|Endung -а oder -я: weiblich. Endet es auf Konsonant: männlich. Endung -о oder -е: sächlich.
2|Welches Geschlecht hat „окно“ (Fenster)?|sächlich|männlich|weiblich|Endung -о oder -е bedeutet sächlich.
2|Welches Geschlecht hat „дом“ (Haus)?|männlich|weiblich|sächlich|Wörter auf Konsonant sind männlich.
2|Wie sagt man „mein Haus“? (дом ist männlich)|мой дом|моя дом|моё дом|мой (männlich), моя (weiblich), моё (sächlich). Das Wort richtet sich nach dem Nomen.
2|Wie sagt man „meine Mama“?|моя мама|мой мама|моё мама|мама endet auf -а und ist weiblich, deshalb моя.
2|Was ist der Plural von „книга“?|книги|книгы|книгов|Aus -а wird im Plural -ы. Nach г, к, х, ж, ч, ш, щ schreibt man stattdessen -и.
3|ты ___ (знать): welche Form passt?|знаешь|знаю|знает|я знаю, ты знаешь, он знает, мы знаем, вы знаете, они знают. Die Endung zeigt die Person.
3|Wie sagt man „Ich spreche“ (говорить)?|Я говорю|Я говорить|Я говоришь|Nie den Infinitiv (говорить) benutzen. Nach я steht -ю oder -у.
3|Wie sagt eine Frau „Ich habe gelesen“?|Я читала|Я читал|Я читало|Vergangenheit: -л (männlich), -ла (weiblich), -ло (sächlich), -ли (Plural). Es zählt, wer spricht.
3|Wie sagt man „Ich werde lesen“?|Я буду читать|Я буду читаю|Я будет читать|Futur: буду, будешь, будет … plus Infinitiv.
4|Wie sagt man „Ich liebe Mama“?|Я люблю маму|Я люблю мама|Я люблю маме|Akkusativ: weibliche Wörter auf -а bekommen -у (мама wird zu маму).
4|Wie sagt man „in Moskau“?|в Москве|в Москва|в Москву|Auf die Frage „wo?“ steht meist -е am Ende. в Москву hieße „nach Moskau“.
4|Wie sagt man „Ich habe einen Bruder“?|У меня есть брат|Я имею брат|Я есть брат|„Haben“ heißt: у меня есть + Sache, wörtlich „bei mir ist …“.`.split("\n").map(r=>{const a=r.split("|");return{g:+a[0],q:a[1],o:a.slice(2,-1),expl:a[a.length-1]}});
const DECKS={
 letters:{t:"Buchstaben",sub:"33 Zeichen mit Aussprache",ic:"Аб",data:C,gr:GROUPS,k:"c"},
 words:{t:"Wörter",sub:"Die wichtigsten Startwörter",ic:"Да",data:Wd,gr:WG,k:"w"},
 phrases:{t:"Phrasen",sub:"Alltag, Reise und Notfall",ic:"Как",data:Pd,gr:PG,k:"p"},
 grammar:{t:"Grammatik",sub:"Einfache Regeln im Quiz",ic:"Что",data:Gd,gr:GG,k:"g"}};
const MODES=Object.keys(DECKS);
const KEY="kyr-karteikarten-v1";
let st={c:{},w:{},p:{},g:{},streak:0,best:0,goal:15,cats:{}};
try{const r=localStorage.getItem(KEY);if(r){const p=JSON.parse(r);if(p&&p.c)Object.assign(st,p)}}catch(e){}
["c","w","p","g"].forEach(k=>st[k]=st[k]||{});
if(Array.isArray(st.cats))st.cats={words:st.cats};
st.cats=st.cats||{};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const D=m=>DECKS[m].data,B=m=>st[DECKS[m].k];
const rec=(m,i)=>B(m)[i]||{b:0,ok:0,no:0};
const status=(m,i)=>{const r=B(m)[i];if(!r||r.ok+r.no===0)return"neu";if(r.b>=3)return"sicher";if(r.b>=1)return"lernend";return"uben"};
const LABEL={neu:"Neu",uben:"Üben",lernend:"Lernend",sicher:"Sicher"};
const COL={neu:"var(--new)",uben:"var(--bad)",lernend:"var(--warn)",sicher:"var(--ok)"};
const TXT={neu:"var(--mut)",uben:"var(--bad)",lernend:"var(--warn)",sicher:"var(--ok)"};
const $=id=>document.getElementById(id);
const dstr=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
let mode="letters",view="home",cur={letters:-1,words:-1,phrases:-1,grammar:-1},flipped=false,opts=null;
const inPool=(m,i)=>{const s=st.cats[m];return!s||!s.length||s.includes(D(m)[i].g)};
function pick(m){
  let open=0;
  const w=D(m).map((_,i)=>{
    if(!inPool(m,i)||i===cur[m])return 0;
    const s=status(m,i);
    if(s==="neu"){if(m!=="letters"&&open>=5)return 0;open++;return 5}
    return({uben:5,lernend:3,sicher:1})[s];
  });
  const tot=w.reduce((a,b)=>a+b,0);
  if(!tot){const f=D(m).findIndex((_,i)=>inPool(m,i));return f<0?0:f}
  let r=Math.random()*tot;
  for(let i=0;i<w.length;i++){r-=w[i];if(r<0)return i}
  return 0;
}
function counts(m,all){const n={neu:0,uben:0,lernend:0,sicher:0};D(m).forEach((_,i)=>{if(all||inPool(m,i))n[status(m,i)]++});return n}
function bar(n,t){return`<div class="bar" role="img" aria-label="${n.sicher} von ${t} sicher">`+["sicher","lernend","uben"].map(k=>`<i style="width:${n[k]/t*100}%;background:${COL[k]}"></i>`).join("")+`</div>`}
const shuf=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
function makeOpts(m,i){
  const c=D(m)[i];
  if(m==="grammar")return shuf(c.o.map((t,k)=>({t,ok:k===0})));
  const L=m==="letters",val=x=>L?x.snd:x.mean;
  const pool=D(m).filter((x,j)=>j!==i&&val(x)!==val(c)),seen=new Set([val(c)]),out=[];
  [...shuf(pool.filter(x=>x.g===c.g)),...shuf(pool)].forEach(x=>{if(out.length<3&&!seen.has(val(x))){seen.add(val(x));out.push(x)}});
  return shuf([c,...out]).map(x=>({t:val(x),ok:x===c}));
}
function catsHtml(m){
  const sel=st.cats[m]||[],gr=DECKS[m].gr;
  return`<div class="cats"><button class="cat" data-c="0" aria-pressed="${!sel.length}">Alle</button>`+gr.map((g,k)=>k?`<button class="cat" data-c="${k}" aria-pressed="${sel.includes(k)}">${g} (${D(m).filter(w=>w.g===k).length})</button>`:"").join("")+`</div>`;
}
function toggleCat(k){
  const m=mode;let sel=st.cats[m]||[];
  if(k===0)sel=[];else sel=sel.includes(k)?sel.filter(x=>x!==k):[...sel,k];
  if(sel.length===DECKS[m].gr.length-1)sel=[];
  st.cats[m]=sel;save();cur[m]=-1;opts=null;flipped=false;renderLearn(false);
}
function dayStreak(){const t=dstr(new Date()),y=dstr(new Date(Date.now()-864e5));return(st.last===t||st.last===y)?(st.ds||0):0}
function tick(){
  const t=dstr(new Date());
  if(!st.day||st.day.d!==t)st.day={d:t,n:0};
  st.day.n++;
  if(st.last!==t){st.ds=(st.last===dstr(new Date(Date.now()-864e5)))?(st.ds||0)+1:1;st.last=t}
}
function renderHome(){
  const t=dstr(new Date()),n=(st.day&&st.day.d===t)?st.day.n:0,g=st.goal||15,pct=Math.min(1,n/g),R=34,CC=2*Math.PI*R,ds=dayStreak();
  const lm=st.lm&&DECKS[st.lm]?st.lm:"letters";
  const ring=`<svg width="84" height="84" viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="${R}" fill="none" stroke="var(--new)" stroke-width="9"/><circle cx="42" cy="42" r="${R}" fill="none" stroke="${n>=g?"var(--ok)":"var(--accent)"}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${CC*pct} ${CC}" transform="rotate(-90 42 42)"/><text x="42" y="49" text-anchor="middle" font-size="22" font-weight="700" fill="currentColor">${n}</text></svg>`;
  $("home").innerHTML=`
    <h1 class="large">Kyrillisch</h1><p class="sub">Russisch lernen, Schritt für Schritt</p>
    <button class="goal" id="goal" aria-label="Tagesziel ändern">${ring}<div><b>Tagesziel</b><span>${n>=g?"Geschafft. Alles darüber ist Bonus.":n+" von "+g+" Karten heute"}</span><span class="fl">${ds?ds+(ds===1?" Tag":" Tage")+" in Folge":"Starte heute deine Serie"}</span></div></button>
    <button class="next home" id="go">Weiter lernen: ${DECKS[lm].t}</button>
    <h2>Lernpfade</h2>
    <div class="mods">`+MODES.map(m=>{const c=counts(m,true),tt=D(m).length;return`<button class="mod" data-m="${m}"><span class="ic">${DECKS[m].ic}</span><span class="mt"><b>${DECKS[m].t}</b><small>${DECKS[m].sub}</small>${bar(c,tt)}</span><span class="cnt">${c.sicher}/${tt}</span></button>`}).join("")+`</div>
    <p class="meta" style="display:block;margin-top:.875rem">Die Reihenfolge von oben nach unten ist ein guter Weg. Du kannst aber jederzeit springen.</p>`;
  $("goal").onclick=()=>{const l=[10,15,25,40];st.goal=l[(l.indexOf(st.goal)+1)%l.length];save();renderHome()};
  $("go").onclick=()=>openMode(lm);
  document.querySelectorAll(".mod").forEach(b=>b.onclick=()=>openMode(b.dataset.m));
}
function openMode(m){mode=m;st.lm=m;save();flipped=false;opts=null;show("learn")}
function renderLearn(anim){
  const m=mode,K=DECKS[m],quiz=!st.self;
  if(cur[m]<0)cur[m]=pick(m);
  const key=m+cur[m];
  if(quiz&&(!opts||opts.key!==key))opts={key,list:makeOpts(m,cur[m]),picked:null};
  const c=D(m)[cur[m]],s=status(m,cur[m]),n=counts(m),t=D(m).filter((_,j)=>inPool(m,j)).length;
  const shown=quiz?opts.picked!==null:flipped;
  let front,back;
  if(m==="letters"){
    front=`<div class="big">${c.u} ${c.l}</div><div class="hint">${quiz?"Welcher Laut ist das?":"Tippe auf die Karte, um die Aussprache zu sehen"}</div>`;
    back=`<div class="small">${c.u} ${c.l}</div><div class="snd">${c.snd}</div>${c.det?`<div class="det">${c.det}</div>`:""}
      <div class="ex">${c.ex}<span>${c.tr}, ${c.mean}</span></div><div class="tip">Merkhilfe: ${c.tip}</div>`;
  }else if(m==="grammar"){
    front=`<div class="gq">${c.q}</div><div class="hint">${quiz?"Wähle die richtige Antwort.":"Überlege dir die Antwort, dann tippe auf die Karte."}</div>`;
    back=`<div class="gq sm">${c.q}</div><div class="snd" style="font-size:1.9rem">${c.o[0]}</div><div class="tip">${c.expl}</div>`;
  }else{
    const sz=c.u.length>22?"1.6rem":c.u.length>12?"2.25rem":"",fs=sz?` style="font-size:${sz}"`:"";
    front=`<div class="word"${fs}>${c.u}</div><div class="hint">${quiz?"Sprich es laut aus. Was bedeutet es?":"Entschlüssele es und sprich es laut aus. Dann tippe auf die Karte."}</div>`;
    back=`<div class="word sm">${c.u}</div><div class="snd" style="font-size:${c.tr.length>12?"1.75rem":"2.5rem"}">${c.tr}</div><div class="mean">${c.mean}</div>${c.tip?`<div class="tip">${c.tip}</div>`:""}`;
  }
  let bottom;
  if(quiz){
    bottom=`<div class="opts${m==="grammar"?" one":""}">`+opts.list.map((o,k)=>`<button data-k="${k}" class="${shown?(o.ok?"ok":(k===opts.picked?"bad":"")):""}" ${shown?"disabled":""}>${o.t}</button>`).join("")+`</div>`+(shown?`<button class="next" id="nx">Weiter</button>`:"");
  }else{
    bottom=`<div class="acts"><button class="no" id="bn" ${flipped?"":"disabled"}>✗ Falsch</button><button class="yes" id="by" ${flipped?"":"disabled"}>✓ Richtig</button></div>`;
  }
  $("learn").innerHTML=`
    <div class="top"><button class="back" id="bk">‹ Start</button><b class="ttl">${K.t}</b><button class="lnk" id="md">Modus: ${quiz?"Quiz":"Selbst"}</button></div>
    ${catsHtml(m)}${bar(n,t)}<div class="meta"><span>${n.sicher} von ${t} sicher</span><span>Serie ${st.streak}</span></div>
    <div class="card${anim?" pop":""}${quiz?" q":" tap"}" id="card" ${quiz?"":'tabindex="0" role="button" aria-label="Karte umdrehen"'}>
      <span class="badge">${K.gr[c.g]}</span><span class="state" style="color:${TXT[s]};background:var(--new)">${LABEL[s]}</span>
      ${shown?back:front}
    </div>${bottom}`;
  $("bk").onclick=()=>{flipped=false;show("home")};
  document.querySelectorAll(".cat").forEach(b=>b.onclick=()=>toggleCat(+b.dataset.c));
  $("md").onclick=()=>{st.self=!st.self;save();flipped=false;opts=null;renderLearn(false)};
  if(quiz){
    document.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>choose(+b.dataset.k));
    if(shown){$("nx").onclick=next;if($("nx").scrollIntoView)$("nx").scrollIntoView({block:"nearest"})}
  }else{
    $("card").onclick=()=>{if(!flipped){flipped=true;renderLearn(true)}};
    $("bn").onclick=()=>answer(false);
    $("by").onclick=()=>answer(true);
  }
}
function grade(ok){
  const m=mode,r=B(m)[cur[m]]=rec(m,cur[m]);
  if(ok){r.ok++;r.b=Math.min(3,r.b+1);st.streak++;st.best=Math.max(st.best,st.streak)}
  else{r.no++;r.b=0;st.streak=0}
  tick();
  try{navigator.vibrate&&navigator.vibrate(ok?10:[16,40,16])}catch(e){}
  save();
}
function answer(ok){if(!flipped)return;grade(ok);flipped=false;cur[mode]=pick(mode);renderLearn(true)}
function choose(k){if(!opts||opts.picked!==null)return;opts.picked=k;grade(opts.list[k].ok);renderLearn(true)}
function next(){cur[mode]=pick(mode);renderLearn(true)}
function renderProg(){
  let ok=0,no=0;["c","w","p","g"].forEach(k=>Object.values(st[k]).forEach(r=>{ok+=r.ok;no+=r.no}));
  const tot=ok+no,acc=tot?Math.round(ok/tot*100):0;
  const sec=m=>{
    const n=counts(m,true),t=D(m).length,cell=m==="letters"||m==="grammar";
    const items=D(m).map((c,i)=>`<button class="${cell?"cell":"chip"} s-${status(m,i)}" data-m="${m}" data-i="${i}" aria-label="${m==="grammar"?"Frage "+(i+1):c.u}, ${LABEL[status(m,i)]}">${m==="letters"?c.u:m==="grammar"?i+1:c.u}</button>`).join("");
    return`<h2>${DECKS[m].t}</h2>${bar(n,t)}<div class="meta"><span>${n.sicher} von ${t} sicher</span><span>${Math.round(n.sicher/t*100)} %</span></div><div class="${cell?"grid":"chips"}">${items}</div>`;
  };
  $("prog").innerHTML=`
    <h1 class="large">Fortschritt</h1>
    <div class="stats" style="margin-top:1rem"><div class="stat"><b>${tot}</b><span>Karten geübt</span></div><div class="stat"><b>${tot?acc+" %":"–"}</b><span>Trefferquote</span></div><div class="stat"><b>${dayStreak()}</b><span>Tage in Folge</span></div></div>
    ${MODES.map(sec).join("")}
    <div class="legend" style="margin-top:.875rem">${Object.keys(LABEL).map(k=>`<span><i style="background:${COL[k]}"></i>${LABEL[k]}</span>`).join("")}</div>
    <p class="meta" style="display:block;margin-top:.625rem">Sicher heißt: dreimal in Folge richtig. Ein Fehler setzt die Karte zurück auf Üben. Neue Karten kommen nach Wichtigkeit, immer fünf auf einmal. Tippe auf ein Feld, um es gezielt zu lernen.</p>
    <button class="reset" id="rs">Fortschritt zurücksetzen</button>`;
  document.querySelectorAll(".cell,.chip").forEach(b=>b.onclick=()=>{mode=b.dataset.m;cur[mode]=+b.dataset.i;st.lm=mode;flipped=false;opts=null;show("learn")});
  const rs=$("rs");let armed=false;
  rs.onclick=()=>{if(!armed){armed=true;rs.textContent="Wirklich alles löschen? Nochmal tippen";return}
    st={c:{},w:{},p:{},g:{},streak:0,best:0,goal:st.goal,cats:st.cats,self:st.self};save();opts=null;cur={letters:-1,words:-1,phrases:-1,grammar:-1};flipped=false;renderProg()};
}
function show(v){
  view=v;
  ["home","learn","prog"].forEach(k=>$(k).hidden=k!==v);
  $("t-home").setAttribute("aria-selected",v!=="prog");$("t-prog").setAttribute("aria-selected",v==="prog");
  document.querySelector(".tabs").style.setProperty("--i",v==="prog"?1:0);
  if(typeof scrollTo==="function")scrollTo(0,0);
  v==="home"?renderHome():v==="learn"?renderLearn(false):renderProg();
}
$("t-home").onclick=()=>{flipped=false;show("home")};
$("t-prog").onclick=()=>{flipped=false;show("prog")};
document.addEventListener("keydown",e=>{
  if(view!=="learn")return;
  if(!st.self){
    if(!opts)return;
    if(opts.picked===null&&/^[1-4]$/.test(e.key)){choose(+e.key-1);return}
    if(opts.picked!==null&&(e.key===" "||e.key==="Enter")&&document.activeElement.tagName!=="BUTTON"){e.preventDefault();next()}
    return;
  }
  if(e.key===" "||e.key==="Enter"){if(document.activeElement.tagName==="BUTTON")return;e.preventDefault();if(!flipped){flipped=true;renderLearn(true)}}
  else if(flipped&&e.key==="ArrowLeft")answer(false);
  else if(flipped&&e.key==="ArrowRight")answer(true);
});
show("home");
</script>
</body>
</html>
